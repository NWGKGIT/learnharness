name: Linux desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
              console.error("Release tag must equal v followed by the package.json major.minor.patch version");
              process.exit(1);
            }
          '
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  package:
    name: Build and verify Linux x64 packages
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run plugins:setup
      - name: Native renderer tests
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Build packages without publishing
        run: npx electron-builder --linux AppImage deb rpm pacman --x64 --publish never
      - name: Check packaged providers and demo
        run: |
          set -euo pipefail
          payload=dist/linux-unpacked/resources/server/standalone
          runtime=dist/linux-unpacked/learnharness
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
          xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone "$payload" --runtime "$runtime" --browser
      - name: Validate packages and create checksums
        run: node scripts/verify-linux-release.mjs dist
      - uses: actions/upload-artifact@v7
        with:
          name: learnharness-linux-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/latest-linux.yml
            dist/SHA256SUMS

  release:
    name: Publish release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: learnharness-linux-x64
          path: release-assets
      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "LearnHarness ${GITHUB_REF_NAME#v}" --generate-notes
